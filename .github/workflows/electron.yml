name: Electron CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Electron UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Compile main process
        working-directory: desktop
        run: npm run compile

      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer

      - name: Build renderer assets
        working-directory: desktop
        run: node scripts/build.mjs
