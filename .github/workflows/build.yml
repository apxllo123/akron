name: Build Akron

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-akron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS app (ARM64)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer

      - name: Stage Analyzer runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/resources/*
          install -m 755 target/release/akron-analyzer desktop/resources/akron-analyzer

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Electron app
        working-directory: desktop
        run: npm run build

      - name: Validate macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find desktop/dist -type d -name '*.app' -print -quit)"
          test -n "$APP"
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Akron"
          test -x "$APP/Contents/Resources/akron-runtime/akron-analyzer"
          /usr/bin/file "$APP/Contents/MacOS/Akron"

          FRAMEWORKS="$APP/Contents/Frameworks"
          for suffix in "" " (GPU)" " (Plugin)" " (Renderer)"; do
            HELPER="$FRAMEWORKS/Akron Helper${suffix}.app"
            EXECUTABLE="$HELPER/Contents/MacOS/Akron Helper${suffix}"
            PLIST="$HELPER/Contents/Info.plist"
            test -d "$HELPER"
            test -x "$EXECUTABLE"
            test -f "$PLIST"
            ACTUAL_EXECUTABLE="$(/usr/bin/plutil -extract CFBundleExecutable raw "$PLIST")"
            test "$ACTUAL_EXECUTABLE" = "Akron Helper${suffix}"
          done

          /usr/bin/codesign --verify --verbose=2 "$APP"
          /usr/bin/codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/Akron-code-signature.txt"

          echo "Gatekeeper assessment is informational for this non-notarized development build:"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$APP" || true

      - name: Test final ZIP through LaunchServices
        shell: bash
        run: |
          set -u
          ZIP="$(find desktop/dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          EXTRACT="$RUNNER_TEMP/Akron-distribution"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          /usr/bin/ditto -x -k "$ZIP" "$EXTRACT"
          APP="$EXTRACT/Akron.app"
          test -d "$APP"

          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Akron"
          FRAMEWORKS="$APP/Contents/Frameworks"
          for suffix in "" " (GPU)" " (Plugin)" " (Renderer)"; do
            HELPER="$FRAMEWORKS/Akron Helper${suffix}.app"
            EXECUTABLE="$HELPER/Contents/MacOS/Akron Helper${suffix}"
            PLIST="$HELPER/Contents/Info.plist"
            test -x "$EXECUTABLE"
            ACTUAL_EXECUTABLE="$(/usr/bin/plutil -extract CFBundleExecutable raw "$PLIST")"
            test "$ACTUAL_EXECUTABLE" = "Akron Helper${suffix}"
          done
          /usr/bin/codesign --verify --verbose=2 "$APP"

          LOG="$RUNNER_TEMP/Akron-distribution-launch.log"
          echo "Launching extracted Akron.app through LaunchServices"
          /usr/bin/open "$APP" >"$LOG" 2>&1 || true

          READY=0
          for _ in $(seq 1 10); do
            if pgrep -f "$APP/Contents/MacOS/Akron" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          echo "--- LaunchServices output ---"
          cat "$LOG"

          if [ "$READY" -eq 1 ]; then
            echo "Extracted distributed Akron.app launched successfully through LaunchServices."
            pkill -f "$APP/Contents/MacOS/Akron" 2>/dev/null || true
            exit 0
          fi

          echo "Extracted distributed Akron.app did not remain running after LaunchServices launch."
          exit 1

      - name: Upload macOS launch diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Akron-macos-launch-diagnostics
          path: |
            ${{ runner.temp }}/Akron-distribution-launch.log
            ${{ runner.temp }}/Akron-code-signature.txt
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: Akron-macos-arm64
          path: desktop/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows app (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer

      - name: Stage Analyzer runtime
        shell: pwsh
        run: |
          Get-ChildItem desktop/resources -Force | Remove-Item -Recurse -Force
          Copy-Item target/release/akron-analyzer.exe desktop/resources/akron-analyzer.exe

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Electron app
        working-directory: desktop
        run: npm run build

      - name: Validate Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: Akron-windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
          compression-level: 0
