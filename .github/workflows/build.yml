name: Build Akron

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS app (ARM64)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace
        run: cargo check --workspace --all-targets

      - name: Build Akron
        run: cargo build --release -p akron-adapter

      - name: Create .app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/Akron.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          rm -rf "$APP_DIR"
          mkdir -p "$MACOS" "$RESOURCES"
          install -m 755 "target/release/akron" "$MACOS/Akron"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Akron</string>
              <key>CFBundleExecutable</key>
              <string>Akron</string>
              <key>CFBundleIdentifier</key>
              <string>com.apxllo.akron</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Akron</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSRequiresNativeExecution</key>
              <true/>
          </dict>
          </plist>
          PLIST

          /usr/bin/codesign --force --deep --sign - "$APP_DIR"
          /usr/bin/codesign --verify --deep --strict "$APP_DIR"
          /usr/bin/plutil -lint "$CONTENTS/Info.plist"
          /usr/bin/codesign -dv --verbose=2 "$APP_DIR" 2>&1 | tee "$RUNNER_TEMP/Akron-code-signature.txt"
          file "$MACOS/Akron"

          ditto -c -k --keepParent "$APP_DIR" "$RUNNER_TEMP/Akron-macos-arm64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: Akron-macos-arm64
          path: ${{ runner.temp }}/Akron-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows binary
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace
        run: cargo check --workspace --all-targets

      - name: Build Akron
        run: cargo build --release -p akron-adapter

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: Akron-windows-x64
          path: target/release/akron.exe
          if-no-files-found: error
          compression-level: 0
