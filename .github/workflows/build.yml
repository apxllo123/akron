name: Build Akron

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Akron Analyzer/**'
      - 'Akron Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-akron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app (ARM64 native)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Print build toolchain
        run: |
          set -euo pipefail
          echo "== Toolchain =="
          rustc --version
          swift --version
          xcodebuild -version
          node --version
          npm --version
          xcode-select -p

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer

      - name: Stage Analyzer runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/resources/*
          install -m 755 target/release/akron-analyzer desktop/resources/akron-analyzer

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer

      - name: Stage renderer assets
        working-directory: desktop
        run: node scripts/build.mjs

      - name: Build native macOS app
        working-directory: desktop
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash macos/build.sh

      - name: Validate native macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP="desktop/dist-native/Akron.app"
          ZIP="desktop/dist-native/Akron-Native-macos-arm64.zip"
          ZIP_SHA="desktop/dist-native/Akron-Native-macos-arm64.zip.sha256"
          DMG="desktop/dist-native/Akron-Native-macos-arm64.dmg"
          DMG_SHA="desktop/dist-native/Akron-Native-macos-arm64.dmg.sha256"

          echo "== Paths =="
          printf 'APP=%s\nZIP=%s\nZIP_SHA=%s\nDMG=%s\nDMG_SHA=%s\n' "$APP" "$ZIP" "$ZIP_SHA" "$DMG" "$DMG_SHA"
          test -d "$APP" || { echo "FAIL: missing native app bundle: $APP" >&2; exit 1; }
          test -f "$ZIP" || { echo "FAIL: missing native ZIP: $ZIP" >&2; exit 1; }
          test -f "$ZIP_SHA" || { echo "FAIL: missing ZIP checksum: $ZIP_SHA" >&2; exit 1; }
          test -f "$DMG" || { echo "FAIL: missing native DMG: $DMG" >&2; exit 1; }
          test -f "$DMG_SHA" || { echo "FAIL: missing DMG checksum: $DMG_SHA" >&2; exit 1; }

          echo "== Main bundle =="
          /usr/bin/plutil -lint "$APP/Contents/Info.plist" || { echo "FAIL: invalid main Info.plist" >&2; exit 1; }
          /usr/bin/plutil -p "$APP/Contents/Info.plist"
          MAIN="$APP/Contents/MacOS/Akron"
          test -f "$MAIN" || { echo "FAIL: missing main executable: $MAIN" >&2; exit 1; }
          MODE="$(/usr/bin/stat -f '%Sp %OLp' "$MAIN")"
          echo "Akron mode: $MODE"
          /usr/bin/file "$MAIN"
          test -x "$MAIN" || { echo "FAIL: main executable is not executable: $MAIN (mode $MODE)" >&2; exit 1; }
          /usr/bin/otool -L "$MAIN"

          echo "== Analyzer =="
          ANALYZER="$APP/Contents/Resources/akron-runtime/akron-analyzer"
          test -f "$ANALYZER" || { echo "FAIL: missing Analyzer: $ANALYZER" >&2; exit 1; }
          ANALYZER_MODE="$(/usr/bin/stat -f '%Sp %OLp' "$ANALYZER")"
          echo "Analyzer mode: $ANALYZER_MODE"
          test -x "$ANALYZER" || { echo "FAIL: Analyzer is not executable: $ANALYZER (mode $ANALYZER_MODE)" >&2; exit 1; }
          /usr/bin/file "$ANALYZER"

          echo "== Adapter =="
          ADAPTER="$APP/Contents/Resources/akron-runtime/akron-adapter"
          test -f "$ADAPTER" || { echo "FAIL: missing Adapter: $ADAPTER" >&2; exit 1; }
          ADAPTER_MODE="$(/usr/bin/stat -f '%Sp %OLp' "$ADAPTER")"
          echo "Adapter mode: $ADAPTER_MODE"
          test -x "$ADAPTER" || { echo "FAIL: Adapter is not executable: $ADAPTER (mode $ADAPTER_MODE)" >&2; exit 1; }
          /usr/bin/file "$ADAPTER"

          echo "== Renderer =="
          test -f "$APP/Contents/Resources/ui/index.html" || { echo "FAIL: missing renderer index.html" >&2; exit 1; }
          test -f "$APP/Contents/Resources/ui/renderer.js" || { echo "FAIL: missing renderer.js" >&2; exit 1; }
          test -f "$APP/Contents/Resources/ui/styles.css" || { echo "FAIL: missing styles.css" >&2; exit 1; }

          echo "== Native marker =="
          MARKER="$APP/Contents/Resources/Akron-Build.txt"
          test -f "$MARKER" || { echo "FAIL: missing native build marker: $MARKER" >&2; exit 1; }
          cat "$MARKER"
          grep -Fq "Host: AppKit + WKWebView" "$MARKER" || { echo "FAIL: wrong native host marker" >&2; exit 1; }
          grep -Fq "Electron runtime: not used" "$MARKER" || { echo "FAIL: native marker says Electron runtime is used" >&2; exit 1; }
          grep -Fq "Validation profile: native-macos-v4" "$MARKER" || { echo "FAIL: stale native validation profile" >&2; exit 1; }
          grep -Fq "Git SHA: $GITHUB_SHA" "$MARKER" || { echo "FAIL: artifact Git SHA does not match workflow commit" >&2; exit 1; }
          grep -Fq "Distribution: ZIP + DMG" "$MARKER" || { echo "FAIL: native distribution marker missing ZIP + DMG" >&2; exit 1; }

          echo "== Icon =="
          ICON="$APP/Contents/Resources/Akron.icns"
          test -f "$ICON" || { echo "FAIL: missing native Akron icon: $ICON" >&2; exit 1; }
          test -s "$ICON" || { echo "FAIL: native Akron icon is empty" >&2; exit 1; }
          /usr/bin/file "$ICON"
          /usr/bin/plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist"

          echo "== Native package must not contain Electron runtime =="
          if find "$APP/Contents" -type f \( -name 'Electron Framework' -o -name 'electron' -o -name 'app.asar' \) -print -quit | grep -q .; then
            echo "FAIL: Electron runtime unexpectedly present in native package" >&2
            exit 1
          fi

          echo "== Code signature =="
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP" || { echo "FAIL: native app code signature invalid" >&2; exit 1; }
          /usr/bin/codesign --display --verbose=4 "$APP" || true

          echo "== ZIP checksum =="
          /usr/bin/shasum -a 256 -c "$ZIP_SHA" || { echo "FAIL: ZIP checksum mismatch" >&2; exit 1; }

          echo "== DMG checksum =="
          /usr/bin/shasum -a 256 -c "$DMG_SHA" || { echo "FAIL: DMG checksum mismatch" >&2; exit 1; }

          echo "== DMG structure =="
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen)"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          if [[ -z "$MOUNT_PATH" ]]; then
            echo "FAIL: DMG could not be mounted" >&2
            exit 1
          fi
          trap '/usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT_PATH/Akron.app" || { echo "FAIL: DMG is missing Akron.app" >&2; exit 1; }
          test -d "$MOUNT_PATH/Applications" || { echo "FAIL: DMG is missing Applications shortcut" >&2; exit 1; }
          test -x "$MOUNT_PATH/Akron.app/Contents/MacOS/Akron" || { echo "FAIL: DMG app executable is not executable" >&2; exit 1; }
          test -f "$MOUNT_PATH/Akron.app/Contents/Resources/Akron.icns" || { echo "FAIL: DMG app is missing Akron.icns" >&2; exit 1; }
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$MOUNT_PATH/Akron.app" || { echo "FAIL: DMG app signature invalid" >&2; exit 1; }
          /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet
          trap - EXIT

      - name: Test distributed native DMG through LaunchServices
        shell: bash
        run: |
          set -u
          DMG="desktop/dist-native/Akron-Native-macos-arm64.dmg"
          LOG="$RUNNER_TEMP/Akron-native-dmg-launch.log"
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen 2>"$RUNNER_TEMP/Akron-dmg-attach.err")"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          if [ -z "$MOUNT_PATH" ]; then
            echo "FAIL: could not mount distributed Akron DMG" >&2
            cat "$RUNNER_TEMP/Akron-dmg-attach.err" >&2 || true
            exit 1
          fi

          APP="$MOUNT_PATH/Akron.app"
          echo "== Mounted DMG =="
          echo "Volume: $MOUNT_PATH"
          test -d "$APP" || { echo "FAIL: mounted DMG missing Akron.app" >&2; /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true; exit 1; }

          echo "== LaunchServices launch from mounted DMG =="
          /usr/bin/open "$APP" >"$LOG" 2>&1 || true

          READY=0
          for _ in $(seq 1 15); do
            if /usr/bin/pgrep -f -- "$APP/Contents/MacOS/Akron$" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          echo "--- LaunchServices output ---"
          cat "$LOG" || true

          if [ "$READY" -eq 1 ]; then
            echo "PASS: distributed Akron DMG launched successfully through LaunchServices."
            /usr/bin/pkill -f -- "$APP/Contents/MacOS/Akron$" 2>/dev/null || true
            /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
            exit 0
          fi

          echo "FAIL: distributed Akron DMG app did not remain running after LaunchServices launch." >&2
          echo "--- Process snapshot ---" >&2
          /bin/ps -axo pid=,ppid=,stat=,command= | grep -E 'Akron|akron-analyzer|akron-adapter' >&2 || true
          echo "--- Recent native crash reports ---" >&2
          found=0
          for report in "$HOME"/Library/Logs/DiagnosticReports/Akron*.crash "$HOME"/Library/Logs/DiagnosticReports/Akron*.ips; do
            if [ -f "$report" ]; then
              found=1
              echo "### $report" >&2
              tail -n 160 "$report" >&2 || true
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Akron crash report found." >&2
          fi
          /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
          exit 1

      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akron-macos-arm64
          path: |
            desktop/dist-native/Akron-Native-macos-arm64.zip
            desktop/dist-native/Akron-Native-macos-arm64.zip.sha256
            desktop/dist-native/Akron-Native-macos-arm64.dmg
            desktop/dist-native/Akron-Native-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Attach macOS artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 30); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Release $tag did not become available in time." >&2
              exit 1
            fi
            sleep 2
          done
          gh release upload "$tag" \
            desktop/dist-native/Akron-Native-macos-arm64.zip \
            desktop/dist-native/Akron-Native-macos-arm64.zip.sha256 \
            desktop/dist-native/Akron-Native-macos-arm64.dmg \
            desktop/dist-native/Akron-Native-macos-arm64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
