name: Build Akron

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-akron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS app (ARM64)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer

      - name: Stage Analyzer runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/resources/*
          install -m 755 target/release/akron-analyzer desktop/resources/akron-analyzer

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer

      - name: Stage renderer assets
        working-directory: desktop
        run: node scripts/build.mjs

      - name: Build native macOS app
        working-directory: desktop
        run: bash macos/build.sh

      - name: Validate native macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          APP="desktop/dist-native/Akron.app"
          ZIP="desktop/dist-native/Akron-macos-arm64.zip"
          test -d "$APP"
          test -f "$ZIP"
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Akron"
          test -x "$APP/Contents/Resources/akron-runtime/akron-analyzer"
          test -f "$APP/Contents/Resources/ui/index.html"
          test -f "$APP/Contents/Resources/ui/renderer.js"
          /usr/bin/file "$APP/Contents/MacOS/Akron"
          /usr/bin/codesign --verify --verbose=2 "$APP"

      - name: Test distributed ZIP
        shell: bash
        run: |
          set -u
          ZIP="desktop/dist-native/Akron-macos-arm64.zip"
          EXTRACT="$RUNNER_TEMP/Akron-distribution"
          LOG="$RUNNER_TEMP/Akron-distribution-launch.log"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          /usr/bin/ditto -x -k "$ZIP" "$EXTRACT"
          APP="$EXTRACT/Akron.app"

          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Akron"
          test -x "$APP/Contents/Resources/akron-runtime/akron-analyzer"
          test -f "$APP/Contents/Resources/ui/index.html"
          test -f "$APP/Contents/Resources/ui/renderer.js"
          /usr/bin/codesign --verify --verbose=2 "$APP"

          echo "Launching native Akron.app through LaunchServices"
          /usr/bin/open "$APP" >"$LOG" 2>&1 || true

          READY=0
          for _ in $(seq 1 10); do
            if pgrep -f "$APP/Contents/MacOS/Akron" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          cat "$LOG"
          if [ "$READY" -eq 1 ]; then
            echo "Native distributed Akron.app launched successfully."
            pkill -f "$APP/Contents/MacOS/Akron" 2>/dev/null || true
            exit 0
          fi

          echo "Native distributed Akron.app failed to remain running."
          exit 1

      - name: Upload macOS launch diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Akron-macos-launch-diagnostics
          path: ${{ runner.temp }}/Akron-distribution-launch.log
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: Akron-macos-arm64
          path: desktop/dist-native/Akron-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows app (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer

      - name: Stage Analyzer runtime
        shell: pwsh
        run: |
          Get-ChildItem desktop/resources -Force | Remove-Item -Recurse -Force
          Copy-Item target/release/akron-analyzer.exe desktop/resources/akron-analyzer.exe

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Electron app
        working-directory: desktop
        run: npm run build

      - name: Validate Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: Akron-windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
          compression-level: 0
