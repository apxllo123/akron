name: Release Akron

on:
  push:
    branches: [main]
    paths:
      - 'Akron Analyzer/**'
      - 'Akron Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-akron
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    name: Bump and publish Akron release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Calculate next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          current="$(node -p "require('./desktop/package.json').version")"

          if [[ -z "$latest_tag" ]]; then
            release_version="$current"
          else
            base="${latest_tag#v}"
            IFS='.' read -r major minor _patch <<< "$base"
            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Latest tag '$latest_tag' is not a supported Akron release version." >&2
              exit 1
            fi

            # Akron releases advance 0.1 -> ... -> 0.9 -> 1.0 -> 1.1.
            # Normalize the malformed 0.10/0.11 releases that were created by
            # the previous increment-only versioning logic.
            if [[ "$major" == "0" && "$minor" -ge 9 ]]; then
              release_version="1.0.0"
            elif (( minor >= 9 )); then
              release_version="$((major + 1)).0.0"
            else
              release_version="${major}.$((minor + 1)).0"
            fi
          fi

          release_tag="v${release_version%.*}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Current package version: $current"
          echo "Latest release tag: ${latest_tag:-<none>}"
          echo "Next release: $release_tag ($release_version)"

          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi

      - name: Update application versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const packagePath = 'desktop/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          path = Path('desktop/macos/Info.plist')
          with path.open('rb') as handle:
              plist = plistlib.load(handle)

          plist['CFBundleShortVersionString'] = os.environ['RELEASE_VERSION']
          plist['CFBundleVersion'] = os.environ['BUILD_NUMBER']

          with path.open('wb') as handle:
              plistlib.dump(plist, handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Verify version files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./desktop/package.json').version")"
          plist_version="$(python3 - <<'PY'
          import plistlib
          with open('desktop/macos/Info.plist', 'rb') as handle:
              print(plistlib.load(handle)['CFBundleShortVersionString'])
          PY
          )"
          test "$package_version" = "$RELEASE_VERSION"
          test "$plist_version" = "$RELEASE_VERSION"
          echo "Verified application version: $RELEASE_VERSION"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/package.json desktop/macos/Info.plist; then
            echo "No version-file changes required for the initial release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/macos/Info.plist
          git commit -m "chore: bump release version to ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin main

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git tag -a "$RELEASE_TAG" -m "Akron $RELEASE_TAG" origin/main
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Akron $RELEASE_TAG" \
            --generate-notes

      - name: Wait for tagged Build Akron workflow
        id: build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --ref "$RELEASE_TAG" \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0].databaseId // empty')"

            if [[ -n "$run_id" ]]; then
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // empty')"
              echo "Build run $run_id: status=$status conclusion=${conclusion:-pending}"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "Tagged Build Akron failed: $conclusion" >&2
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Waiting for tagged Build Akron run..."
            fi

            sleep 10
          done

          echo "Timed out waiting for tagged Build Akron workflow." >&2
          exit 1

      - name: Download macOS release artifacts
        env:
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name akron-macos-arm64 \
            --dir release-assets

          find release-assets -type f -print

      - name: Attach macOS artifacts to GitHub release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo "No macOS release assets were found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
