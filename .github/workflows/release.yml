name: Release Akron

on:
  push:
    branches: [main]
    paths:
      - 'Akron Analyzer/**'
      - 'Akron Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to resume, e.g. v1.9 (leave empty for a new release)'
        required: false
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-akron
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    name: Bump and publish Akron release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve release mode
        id: mode
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            release_tag="${RELEASE_TAG_INPUT#v}"
            if [[ "$release_tag" =~ ^([0-9]+)\.([0-9]+)(\.0)?$ ]]; then
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            else
              echo "Invalid release_tag '$RELEASE_TAG_INPUT'. Expected v1.9 or v1.9.0." >&2
              exit 1
            fi
            release_version="${release_tag#v}.0"
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "version=$release_version" >> "$GITHUB_OUTPUT"
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          current="$(node -p "require('./desktop/package.json').version")"

          if [[ -z "$latest_tag" ]]; then
            release_version="$current"
          else
            base="${latest_tag#v}"
            IFS='.' read -r major minor _patch <<< "$base"
            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Latest tag '$latest_tag' is not a supported Akron release version." >&2
              exit 1
            fi
            if [[ "$major" == "0" && "$minor" -ge 9 ]]; then
              release_version="1.0.0"
            elif (( minor >= 9 )); then
              release_version="$((major + 1)).0.0"
            else
              release_version="${major}.$((minor + 1)).0"
            fi
          fi

          release_tag="v${release_version%.*}"
          echo "mode=new" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi

      - name: Update application versions
        if: steps.mode.outputs.mode == 'new'
        env:
          RELEASE_VERSION: ${{ steps.mode.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const packagePath = 'desktop/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          path = Path('desktop/macos/Info.plist')
          with path.open('rb') as handle:
              plist = plistlib.load(handle)
          plist['CFBundleShortVersionString'] = os.environ['RELEASE_VERSION']
          plist['CFBundleVersion'] = os.environ['BUILD_NUMBER']
          with path.open('wb') as handle:
              plistlib.dump(plist, handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Verify version files
        if: steps.mode.outputs.mode == 'new'
        env:
          RELEASE_VERSION: ${{ steps.mode.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./desktop/package.json').version")"
          plist_version="$(python3 - <<'PY'
          import plistlib
          with open('desktop/macos/Info.plist', 'rb') as handle:
              print(plistlib.load(handle)['CFBundleShortVersionString'])
          PY
          )"
          test "$package_version" = "$RELEASE_VERSION"
          test "$plist_version" = "$RELEASE_VERSION"

      - name: Commit version bump
        if: steps.mode.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/package.json desktop/macos/Info.plist; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/macos/Info.plist
          git commit -m "chore: bump release version to ${{ steps.mode.outputs.tag }} [skip ci]"
          git push origin main

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Using existing release tag $RELEASE_TAG"
          else
            git tag -a "$RELEASE_TAG" -m "Akron $RELEASE_TAG" origin/main
            git push origin "$RELEASE_TAG"
          fi

      - name: Ensure GitHub release exists
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing GitHub release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Akron $RELEASE_TAG" --generate-notes
          fi

      - name: Find or start tagged  Build
        id: build
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "Looking for  Build for $RELEASE_TAG at $tag_sha"

          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow '.yml' \
            --commit "$tag_sha" \
            --limit 20 \
            --json databaseId,status,conclusion,event,headSha \
            --jq ".[] | select(.headSha == \"$tag_sha\" and (.event == \"workflow_dispatch\" or .event == \"push\")) | .databaseId" | head -n 1)"

          if [[ -n "$run_id" ]]; then
            echo "Found existing  Build run $run_id before waiting."
          else
            echo "No existing  Build run found; dispatching one for $RELEASE_TAG."
            gh workflow run '.yml' --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          fi

          for attempt in $(seq 1 90); do
            if [[ -z "$run_id" ]]; then
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow '.yml' \
                --commit "$tag_sha" \
                --limit 20 \
                --json databaseId,status,conclusion,event,headSha \
                --jq ".[] | select(.headSha == \"$tag_sha\" and .event == \"workflow_dispatch\") | .databaseId" | head -n 1)"
            fi

            if [[ -n "$run_id" ]]; then
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // empty')"
              echo " Build run $run_id: status=$status conclusion=${conclusion:-pending}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo " Build failed: $conclusion" >&2; exit 1; }
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo " Build has not appeared yet; checking again..."
            fi
            sleep 2
          done

          echo "Timed out waiting for  Build workflow." >&2
          exit 1

      - name: Download macOS release artifacts
        env:
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name akron-macos-arm64 --dir release-assets
          find release-assets -type f -print

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' \) | wc -l | tr -d ' ')"
          [[ "$count" -eq 4 ]] || {
            echo "Expected exactly 4 macOS release assets, found $count." >&2
            find release-assets -type f -print >&2
            exit 1
          }

      - name: Attach macOS artifacts to GitHub release
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' \) -print)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
