name:  Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Akron Analyzer/**'
      - 'Akron Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: true
        type: string

concurrency:
  group: build-akron-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name:  Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Print build toolchain
        run: |
          set -euo pipefail
          rustc --version
          swift --version
          xcodebuild -version
          node --version
          npm --version
          xcode-select -p
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build Analyzer
        run: cargo build --release -p akron-analyzer
      - name: Stage Analyzer runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/resources/*
          install -m 755 target/release/akron-analyzer desktop/resources/akron-analyzer
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer
      - name: Stage renderer assets
        working-directory: desktop
        run: node scripts/build.mjs
      - name: Build native macOS app
        working-directory: desktop
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash macos/build.sh
      - name: Validate native macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP="desktop/dist-native/Akron.app"
          ZIP="desktop/dist-native/Akron-Native-macos-arm64.zip"
          ZIP_SHA="desktop/dist-native/Akron-Native-macos-arm64.zip.sha256"
          DMG="desktop/dist-native/Akron-Native-macos-arm64.dmg"
          DMG_SHA="desktop/dist-native/Akron-Native-macos-arm64.dmg.sha256"
          test -d "$APP"
          test -f "$ZIP"
          test -f "$ZIP_SHA"
          test -f "$DMG"
          test -f "$DMG_SHA"
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          MAIN="$APP/Contents/MacOS/Akron"
          test -x "$MAIN"
          /usr/bin/file "$MAIN"
          ANALYZER="$APP/Contents/Resources/akron-runtime/akron-analyzer"
          test -x "$ANALYZER"
          /usr/bin/file "$ANALYZER"
          ADAPTER="$APP/Contents/Resources/akron-runtime/akron-adapter"
          test -x "$ADAPTER"
          /usr/bin/file "$ADAPTER"
          test -f "$APP/Contents/Resources/ui/index.html"
          test -f "$APP/Contents/Resources/ui/renderer.js"
          test -f "$APP/Contents/Resources/ui/styles.css"
          MARKER="$APP/Contents/Resources/Akron-Build.txt"
          test -f "$MARKER"
          grep -Fq "Host: AppKit + WKWebView" "$MARKER"
          grep -Fq "Electron runtime: not used" "$MARKER"
          grep -Fq "Validation profile: native-macos-v5" "$MARKER"
          grep -Fq "Git SHA: $GITHUB_SHA" "$MARKER"
          grep -Fq "Distribution: ZIP + DMG" "$MARKER"
          ICON="$APP/Contents/Resources/Akron.icns"
          test -s "$ICON"
          /usr/bin/plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist"
          if find "$APP/Contents" -type f \( -name 'Electron Framework' -o -name 'electron' -o -name 'app.asar' \) -print -quit | grep -q .; then
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/shasum -a 256 -c "$ZIP_SHA"
          /usr/bin/shasum -a 256 -c "$DMG_SHA"
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen)"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          test -n "$MOUNT_PATH"
          trap '/usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT_PATH/Akron.app"
          test -d "$MOUNT_PATH/Applications"
          test -x "$MOUNT_PATH/Akron.app/Contents/MacOS/Akron"
          test -f "$MOUNT_PATH/Akron.app/Contents/Resources/Akron.icns"
          /usr/bin/codesign --verify --deep --strict "$MOUNT_PATH/Akron.app"
          /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet
          trap - EXIT
      - name: Test distributed native DMG through LaunchServices
        shell: bash
        run: |
          set -u
          DMG="desktop/dist-native/Akron-Native-macos-arm64.dmg"
          LOG="$RUNNER_TEMP/Akron-native-dmg-launch.log"
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen 2>"$RUNNER_TEMP/Akron-dmg-attach.err")"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          if [ -z "$MOUNT_PATH" ]; then
            exit 1
          fi
          APP="$MOUNT_PATH/Akron.app"
          /usr/bin/open "$APP" >"$LOG" 2>&1 || true
          READY=0
          for _ in $(seq 1 15); do
            if /usr/bin/pgrep -f -- "$APP/Contents/MacOS/Akron$" >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
            exit 1
          fi
          /usr/bin/pkill -f -- "$APP/Contents/MacOS/Akron$" 2>/dev/null || true
          /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akron-macos-arm64
          path: |
            desktop/dist-native/Akron-Native-macos-arm64.zip
            desktop/dist-native/Akron-Native-macos-arm64.zip.sha256
            desktop/dist-native/Akron-Native-macos-arm64.dmg
            desktop/dist-native/Akron-Native-macos-arm64.dmg.sha256
          if-no-files-found: error
